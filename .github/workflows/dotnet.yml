# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build and test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore src
    - name: Build
      run: dotnet build src --no-restore --configuration Release
    - name: Test
      run: dotnet test src --no-build --verbosity normal --configuration Release
    - name: Publish to NuGet
      run: |
        for package in $(find . -name '*.nupkg'); do
          dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.PACKAGE_N2 }}
        done
